[workspace]
resolver = "2"
members = [
    "crates/navi-ontology",
    "crates/navi-graph",
    "crates/navi-cli",
    "crates/realm-core",
    "crates/realm-compiler",
    "crates/realm-layout",
    "crates/realm-render",
    "crates/realm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elci-group/navi"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
navi-ontology = { path = "crates/navi-ontology" }
navi-graph = { path = "crates/navi-graph" }
realm-core = { path = "crates/realm-core" }
realm-compiler = { path = "crates/realm-compiler" }
realm-layout = { path = "crates/realm-layout" }
realm-render = { path = "crates/realm-render" }
